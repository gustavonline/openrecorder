name: Verify release

# Runs after a release is published (by a person, with the files built and checked locally). It downloads every asset from
# the release, checks sizes and SHA-256 against manifest.json and SHA256SUMS, inspects the ZIPs and tarballs, and checks that the
# site's releases.json agrees. It publishes and changes nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (for example v0.6.0-preview.11)
        required: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify every asset
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/verify-release.py --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
      - name: The site agrees with the release
        run: python3 scripts/check-site.py --network
